<!doctype html>
<!-- HTP ATTD / live lower third (1920x1080) — the HTML twin of allpicks.py: the HTP lower-third bar with one slot per
     player (headshot rising out of the bar + name + bet line) or team (logo + line), and the red title tab.
     CFG: {title: "HTP · ANYTIME TD", slots: [{name, line} player | {team, line} logo; htpcard adds each slot's img], out_name} -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: TB; src: url("https://fonts.gstatic.com/s/anton/v27/1Ptgg87LROyAm3Kz-C8CSKlv.woff2") format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.t { position: absolute; white-space: nowrap; line-height: 1; text-box: trim-both cap alphabetic; color: #fff; font-family: TB; }
.slot { position: absolute; }
.slot img { position: absolute; }
#tab { position: absolute; background: #ce0e29; border-radius: 8px; box-shadow: inset 0 0 0 3px #fff; }
.div { position: absolute; width: 2px; background: rgba(255,255,255,.275); }
</style></head>
<body><div id="root" class="full"></div>
<script>
const CFG = window.CFG, TEAMS = window.TEAMS;
const root = document.getElementById('root');
const X0 = 184, X1 = 1274, Y0 = 920, Y1 = 1032, PAD = 14;
const clamp = x => Math.min(Math.max(x, 0), 1), ease = x => 1 - (1 - clamp(x)) ** 3;
function el(tag, cls, parent, css) { const e = document.createElement(tag); if (cls) e.className = cls; Object.assign(e.style, css || {}); (parent || root).appendChild(e); return e; }
let CAPR = .7;
// text: left edge at x, baseline at y (PIL textbbox placement in allpicks.py), cap px tall
function txt(s, x, y, cap, parent, alpha = 1) {
  const e = el('div', 't', parent, { fontSize: cap / CAPR + 'px', top: y - cap + 'px', left: x + 'px', color: `rgba(255,255,255,${alpha})` });
  e.textContent = s; return e;
}
const SUFFIX = new Set(['JR', 'SR', 'II', 'III', 'IV']);
function loadImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }

let E = {};
async function build() {
  const S = CFG.slots, n = S.length, slot = (X1 - X0 - 2 * PAD) / n;
  const F_NAME = n <= 2 ? 44 : 30, F_SUB = n <= 2 ? 30 : 24, F_LINE = 40;
  const bar = el('img', 'full'); bar.src = 'assets/lower_bar.png';
  const divs = el('div', 'full');
  for (let j = 1; j < n; j++) el('div', 'div', divs, { left: Math.round(X0 + PAD + slot * j) - 1 + 'px', top: Y0 + 22 + 'px', height: Y1 - Y0 - 44 + 'px' });
  // pass 1: every player slot's name shrinks to fit its slot; all names then use the smallest size (uniform)
  const prep = [];
  for (const s of S) {
    // s.img = headshot / logo already cropped to its alpha bbox (and shoulders cut for 5+ players) by htpcard
    const head = !!s.name, cv = await loadImg((window.IMG_PREFIX ?? 'file://') + s.img);
    const box = head ? [Math.min(slot * (n > 4 ? .5 : .55), 175), n > 4 ? 120 : 124] : [Math.min(90, slot * .46), 76];
    const k = cv ? Math.min(box[0] / cv.naturalWidth, box[1] / cv.naturalHeight) : 0, lw = cv ? Math.round(cv.naturalWidth * k) : 0, lh = cv ? Math.round(cv.naturalHeight * k) : 0;
    let name = head ? (s.name || '').toUpperCase() : null;
    if (name && n > 2) name = name.split(' ').slice(1).filter(w => !SUFFIX.has(w.replace(/\./g, ''))).join(' ') || name;
    let cap = F_NAME;
    if (name) { const m = txt(name, 0, 0, cap); while (cap > 8 && lw + 8 + m.offsetWidth > slot - 18) { cap -= 1.4; m.style.fontSize = cap / CAPR + 'px'; } m.remove(); }
    prep.push({ s, head, cv, lw, lh, name, cap });
  }
  const NAMECAP = Math.min(...prep.filter(p => p.name).map(p => p.cap), F_NAME);
  const slots = prep.map((p, i) => {
    const g = el('div', 'full'), cx = X0 + PAD + slot * (i + .5), cy = (Y0 + Y1) / 2, line = (p.s.line || '').toUpperCase();
    const lt = txt(line, 0, 0, p.name ? F_SUB : F_LINE, g), nt = p.name ? txt(p.name, 0, 0, NAMECAP, g) : null;
    const tw = Math.max(lt.offsetWidth, nt ? nt.offsetWidth : 0), total = p.lw + 8 + tw, lx = Math.round(cx - total / 2);
    if (p.cv) { const c = p.cv; c.style.cssText = `position:absolute;left:${lx}px;top:${p.head ? Y1 - p.lh : Math.round(cy - p.lh / 2)}px;width:${p.lw}px;height:${p.lh}px`; g.prepend(c); }
    const tx = lx + p.lw + 8;
    if (nt) { nt.style.left = tx + 'px'; nt.style.top = cy - 6 - NAMECAP + 'px'; lt.style.left = tx + 'px'; lt.style.top = cy + 8 + 'px'; }
    else { lt.style.left = tx + 'px'; lt.style.top = cy - F_LINE / 2 + 'px'; }
    g.style.transformOrigin = `${cx}px ${(Y0 - 50 + Y1 + 10) / 2}px`;
    return g;
  });
  const tab = el('div', ''); tab.id = 'tab';
  const tt = txt(CFG.title.toUpperCase(), 0, 0, 26, tab), w = tt.offsetWidth + 44;
  Object.assign(tab.style, { left: X0 + 14 + 'px', top: Y0 - 44 + 'px', width: w + 'px', height: '50px' });
  tt.style.left = '22px'; tt.style.top = (44 / 2 - 13 + 1) + 'px';
  E = { bar, divs, slots, tab, n };
}

window.DURATION = () => CFG.secs || 4;
window.seek = function (s) {
  const { bar, divs, slots, tab, n } = E;
  const w = ease(s / .4), x = 179 + (1279 - 179) * w;   // bar wipes in left -> right
  bar.style.clipPath = w > 0 ? `inset(0 ${1920 - x}px 0 0)` : 'inset(0 100% 0 0)';
  divs.style.opacity = s > .4 ? ease((s - .4) / .3) : 0;
  const start = .45, step = Math.min(.12, 1.4 / n);
  slots.forEach((g, i) => {
    const p = (s - start - i * step) / .25;
    if (p <= 0) { g.style.opacity = 0; return; }
    const e = Math.min(1, p), sc = e >= 1 ? 1 : .6 + .4 * ease(e) + .08 * Math.max(0, 1 - Math.abs(e - .75) * 4);
    g.style.transform = `scale(${sc})`; g.style.opacity = Math.min(1, e * 2);
  });
  const tp = ease((s - .3) / .3); tab.style.opacity = tp; tab.style.transform = `translateY(${20 * (1 - tp)}px)`;
};

window.READY = (async () => {
  await document.fonts.load('100px TB');
  const c = document.createElement('canvas').getContext('2d'); c.font = '100px TB'; CAPR = c.measureText('H').actualBoundingBoxAscent / 100;
  await build();
  (window.seekCard || seek)(0);   // start state right away, so nothing shows before the animation
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  seek(0);
  if (!window.RENDER) {   // browser / OBS: loop it, or with HOLD play once and stay on the last frame
    const t0 = performance.now(); (function loop() { const el = (performance.now() - t0) / 1000;
      seek(window.HOLD ? Math.min(el, DURATION()) : el % (DURATION() + 1)); if (!window.HOLD || el < DURATION()) requestAnimationFrame(loop); })();
  }
})();
</script></body></html>
